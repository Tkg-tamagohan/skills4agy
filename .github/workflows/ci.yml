name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      require_version_bump: ${{ steps.detect.outputs.require_version_bump }}
      base_sha: ${{ steps.detect.outputs.base_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Detect versioned content changes
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess

          output_path = os.environ["GITHUB_OUTPUT"]
          event_name = os.environ.get("EVENT_NAME", "")
          base_sha = os.environ.get("BASE_SHA", "").strip()
          head_sha = os.environ.get("HEAD_SHA", "").strip()

          def write_outputs(require_bump: bool, base: str) -> None:
              with open(output_path, "a", encoding="utf-8") as f:
                  f.write(f"require_version_bump={'true' if require_bump else 'false'}\n")
                  f.write(f"base_sha={base}\n")

          def reject_non_json_constant(value: str) -> None:
              raise ValueError(f"Invalid JSON constant: {value}")

          def load_plugin_version(rev: str) -> tuple[bool, str | None]:
              res = subprocess.run(
                  ["git", "show", f"{rev}:plugin.json"],
                  capture_output=True,
                  check=False,
              )
              if res.returncode != 0:
                  return False, None
              try:
                  data = json.loads(
                      res.stdout.decode("utf-8"),
                      parse_constant=reject_non_json_constant,
                  )
              except (UnicodeDecodeError, ValueError):
                  return False, None
              if not isinstance(data, dict):
                  return False, None
              ver = data.get("version")
              if not isinstance(ver, str):
                  return False, None
              return True, ver

          if event_name != "pull_request":
              write_outputs(False, "")
              raise SystemExit(0)

          if not base_sha or not head_sha or base_sha == "0" * 40:
              write_outputs(True, base_sha)
              raise SystemExit(0)

          proc = subprocess.run(
              ["git", "diff", "--no-renames", "-z", "--name-only", f"{base_sha}...{head_sha}"],
              capture_output=True,
              check=False,
          )
          if proc.returncode != 0:
              print(f"git diff failed (rc={proc.returncode}); defaulting to require_version_bump=true")
              write_outputs(True, base_sha)
              raise SystemExit(0)

          raw_paths = [p.decode("utf-8", errors="replace") for p in proc.stdout.split(b"\x00") if p]
          if not raw_paths:
              print("changed file list is empty; defaulting to require_version_bump=true")
              write_outputs(True, base_sha)
              raise SystemExit(0)

          versioned_exact = {"AGENTS.md", "README.md", "hooks.json"}
          versioned_prefixes = ("rules/", "skills/")
          require_bump = any(
              path in versioned_exact or path.startswith(versioned_prefixes)
              for path in raw_paths
          )
          if not require_bump and "plugin.json" in raw_paths:
              base_ok, base_ver = load_plugin_version(base_sha)
              head_ok, head_ver = load_plugin_version(head_sha)
              if not base_ok or not head_ok or base_ver != head_ver:
                  require_bump = True
          print("Changed files:", raw_paths)
          print("require_version_bump:", require_bump)
          write_outputs(require_bump, base_sha)
          PY

  check-plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run check_plugin.py
        shell: bash
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
          REQUIRE_VERSION_BUMP: ${{ needs.changes.outputs.require_version_bump }}
          BASE_SHA: ${{ needs.changes.outputs.base_sha }}
        run: |
          if [ "$REQUIRE_VERSION_BUMP" = "true" ] && [ -n "$BASE_SHA" ]; then
            python skills/plugin-authoring/scripts/check_plugin.py --version-base "$BASE_SHA"
          else
            python skills/plugin-authoring/scripts/check_plugin.py
          fi

  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax, JSON syntax, UTF-8, U+FFFD, and conflict markers
        shell: bash
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python - <<'PY'
          import json
          import pathlib
          import py_compile
          import re
          import subprocess
          import sys

          def ls_files(*patterns: str) -> list[str]:
              cmd = ["git", "ls-files", "-z", *patterns]
              proc = subprocess.run(cmd, capture_output=True, check=True)
              return [p.decode("utf-8") for p in proc.stdout.split(b"\x00") if p]

          py_files = ls_files("*.py")
          if not py_files:
              print("ERROR: no Python files found")
              sys.exit(1)
          for rel in py_files:
              py_compile.compile(rel, doraise=True)
          print(f"[PASS] py_compile: {len(py_files)} files")

          def reject_non_json_constant(value: str) -> None:
              raise ValueError(f"Invalid JSON constant: {value}")

          json_files = ls_files("*.json")
          if not json_files:
              print("ERROR: no JSON files found")
              sys.exit(1)
          for rel in json_files:
              text = pathlib.Path(rel).read_text(encoding="utf-8")
              try:
                  json.loads(text, parse_constant=reject_non_json_constant)
              except ValueError as exc:
                  sys.exit(f"[FAIL] {rel}: {exc}")
          print(f"[PASS] json.loads: {len(json_files)} files")

          text_exts = {".md", ".py", ".json", ".yml", ".yaml", ".txt"}
          conflict_re = re.compile(
              r"^(" + "<" * 7 + r"|" + "=" * 7 + r"$|" + ">" * 7 + r")",
              re.MULTILINE,
          )
          checked = 0
          errors: list[str] = []
          for rel in ls_files():
              p = pathlib.Path(rel)
              if p.suffix.lower() not in text_exts or not p.is_file():
                  continue
              checked += 1
              try:
                  content = p.read_text(encoding="utf-8")
              except UnicodeDecodeError as exc:
                  errors.append(f"{rel}: UTF-8 decode error: {exc}")
                  continue
              if "\ufffd" in content:
                  errors.append(f"{rel}: contains U+FFFD replacement character")
              if conflict_re.search(content):
                  errors.append(f"{rel}: contains conflict marker")

          if errors:
              for err in errors:
                  print(f"[FAIL] {err}")
              sys.exit(1)
          print(f"[PASS] text hygiene (UTF-8 / U+FFFD / conflict markers): {checked} files")
          PY

  unit-tests:
    needs: []
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run all skill unit tests
        shell: bash
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: python skills/plugin-authoring/scripts/run_all_tests.py

  ci-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [changes, check-plugin, hygiene, unit-tests]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify all required jobs succeeded
        shell: bash
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          failed = []
          for name, info in sorted(needs.items()):
              result = info.get("result")
              print(f"{name}: {result}")
              if result != "success":
                  failed.append((name, result))
          if failed:
              print("CI summary failed:", failed)
              sys.exit(1)
          PY
